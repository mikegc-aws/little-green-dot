# little-green-dot — example configuration.
#
# Copy to ~/.config/little-green-dot/config.toml and uncomment what you need.
# Every option is optional; with no config file at all the dot watches whatever
# credentials your environment already points at.
#
# Run `little-green-dot --where` to see where the real config file should live,
# or pick "Edit Config…" from the menu to have one created for you.

# --- which credentials to watch ---------------------------------------------

# Pinning a profile is recommended. The AWS CLI ranks environment credentials
# above AWS_PROFILE, so setting this also makes the tool strip AWS_ACCESS_KEY_ID
# and friends from the environment it hands the CLI — otherwise stale keys in
# your shell could show green while this profile had actually expired.
# Leave unset to follow AWS_PROFILE (or the default profile).
# profile = "my-profile"
# region = "us-east-1"

# --- how often to look -------------------------------------------------------

# interval_seconds = 60          # while credentials look good
# invalid_interval_seconds = 15  # while the dot is red, so it goes green soon
                                 # after you log in elsewhere
# timeout_seconds = 10           # give up on a single AWS CLI call after this

# --- appearance --------------------------------------------------------------

# "dots" gives 🟢🟡🔴⚪. "marks" gives ✓ ! ✕ ? which stay readable without
# colour — red and green dots are the same shape, so they are no help if you
# have red-green colour blindness.
# symbols = "dots"

# show_label = false   # show the role name next to the dot in the menu bar.
                       # Handy when running more than one dot at once.
# warn_minutes = 15    # dot turns amber once expiry is this close
# notify = true        # macOS notification when the state changes

# The dropdown is one click away from your account id, and the ARN row also
# carries your session name. Turn these off if you present or screen share to
# audiences who should not see them.
# show_account = true
# show_arn = true

# --- expiry ------------------------------------------------------------------

# Showing "expires in 2h 41m" needs one extra call:
#   aws configure export-credentials
# whose output contains live credential material. It is parsed in memory for the
# Expiration field only, and never logged or written to disk. Set this to false
# if you would rather the tool never see credential material at all.
# show_expiry = true

# --- escape hatch ------------------------------------------------------------

# If the AWS CLI is somewhere unusual, or launchd cannot find it:
# aws_cli_path = "/opt/homebrew/bin/aws"
