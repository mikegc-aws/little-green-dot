name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # macOS only: the app depends on AppKit through rumps, and this is a macOS
    # tool. The tests stub the AWS CLI, so no credentials are involved.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --extra dev --python ${{ matrix.python-version }} pytest -q

  scripts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Check shell scripts parse
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Check scripts are executable
        run: |
          for script in install.sh uninstall.sh; do
            test -x "$script" || { echo "$script is not executable"; exit 1; }
          done

      - name: Lint with shellcheck
        run: |
          brew install shellcheck
          shellcheck install.sh uninstall.sh
